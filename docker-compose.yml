version: '3.8'

services:
  # ============================================================================
  # Relational Database: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: docufin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docufin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docufin_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-docufin_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docufin_user} -d ${POSTGRES_DB:-docufin_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docufin-network

  # ============================================================================
  # Cache & Message Broker: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: docufin-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docufin-network

  # ============================================================================
  # Application Backend: FastAPI Modular Monolith
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docufin-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_NAME: DocuFin AI
      APP_VERSION: 0.1.0
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-docufin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docufin_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-docufin_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docufin_user}:${POSTGRES_PASSWORD:-docufin_password_placeholder}@postgres:5432/${POSTGRES_DB:-docufin_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - docufin-network

  # ============================================================================
  # Application Frontend: React + Vite + Nginx
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docufin-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - docufin-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  docufin-network:
    driver: bridge
